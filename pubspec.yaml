name: napex_victim_app
description: National Anti-Extortion Platform (NAP-EX) - Victim App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ============ State Management ============
  flutter_riverpod: ^2.6.1

  # ============ Navigation ============
  go_router: ^14.6.0

  # ============ Network ============
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # ============ Local Storage ============
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # ============ Platform ============
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  geolocator: ^13.0.1

  # ============ Notifications ============
  flutter_local_notifications: ^19.0.0

  # ============ Security ============
  crypto: ^3.0.5
  encrypt: ^5.0.3

  # ============ Utils ============
  intl: ^0.20.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/blocklists/
    - assets/ml_models/
