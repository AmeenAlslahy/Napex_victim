name: Dashboard (React)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dashboard:
    name: tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
