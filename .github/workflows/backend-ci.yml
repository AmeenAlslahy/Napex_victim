name: Backend (FastAPI)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest
        working-directory: backend
