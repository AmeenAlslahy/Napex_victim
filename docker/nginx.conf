worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # حدود المعدل: 20 طلب/ثانية لكل IP مع دفعة 40
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream backend_up {
        server backend:8000;
    }

    upstream dashboard_up {
        server dashboard:80;
    }

    server {
        listen 80;
        server_name _;

        # أدلة الرقم القياسي: رفع الأدلة حتى 25MB
        client_max_body_size 25m;

        # ============ الواجهة البرمجية ============
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ============ WebSocket (بث فوري) ============
        location /ws {
            proxy_pass http://backend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ============ مقياس Prometheus (داخلي — يُقيَّد بجدار ناري) ============
        location /metrics {
            # اعتماداً على الشبكة الداخلية فقط — احذف التعليق لفتحه
            # allow 10.0.0.0/8; deny all;
            proxy_pass http://backend_up;
        }

        # ============ لوحة التحكم ============
        location / {
            proxy_pass http://dashboard_up;
            proxy_set_header Host $host;
        }
    }

    # للإنتاج: server 443 ssl مع شهادات (cert-manager في K8s أو certbot هنا)
}
